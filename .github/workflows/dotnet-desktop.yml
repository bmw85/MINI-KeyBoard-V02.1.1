name: Windows Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example 0.0.2"
        required: true
        default: "0.0.2"
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild "Src\MINI KeyBoard.sln" /t:Restore /p:Configuration=Release /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "Src\MINI KeyBoard.sln" /t:Build /p:Configuration=Release /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Release
        shell: pwsh
        run: |
          $archive = "MINI-KeyBoard-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "Src\bin\Release\*" -DestinationPath $archive -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINI-KeyBoard-${{ env.RELEASE_TAG }}
          path: MINI-KeyBoard-${{ env.RELEASE_TAG }}.zip
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = "MINI-KeyBoard-$env:RELEASE_TAG.zip"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive --title "MINI KeyBoard $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
